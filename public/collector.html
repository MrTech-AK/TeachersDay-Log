<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Collector Dashboard - Fund Ledger</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/collector.css">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <div>
                <h1 class="header-title">TEACHERS' DAY FUND</h1>
                <div class="user-info">Logged in as: <span id="usernameDisplay">...</span></div>
            </div>
            <button id="logoutBtn" class="btn-text">Logout</button>
        </header>

        <main class="app-main">
            <!-- Navigation -->
            <div class="nav-grid">
                <button id="navReceive" class="nav-btn active">+ RECEIVE MONEY</button>
                <button id="navExpense" class="nav-btn">+ RECORD EXPENSE</button>
                <button id="navActivity" class="nav-btn">MY ACTIVITY</button>
            </div>

            <!-- Views -->
            <section id="viewReceive" class="view active">
                <form id="contributionForm" class="form-container">
                    <div class="form-group">
                        <label for="contributor">Contributor</label>
                        <select id="contributor" name="contributor" required>
                            <option value="">Select contributor...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount" min="1" step="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label>Payment Method</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="payment_method" value="UPI" checked> UPI
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="payment_method" value="Cash"> Cash
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="upiRefGroup">
                        <label for="upi_reference">UPI Reference</label>
                        <input type="text" id="upi_reference" name="upi_reference" placeholder="e.g. 123456789012">
                    </div>

                    <div class="form-group">
                        <label for="note">Note (Optional)</label>
                        <input type="text" id="note" name="note" placeholder="Add a short note">
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary">RECORD CONTRIBUTION</button>
                    <div id="formFeedback" class="feedback-msg"></div>
                </form>
            </section>

            <section id="viewExpense" class="view">
                <form id="expenseForm" class="form-container">
                    <div class="form-group">
                        <label for="expCategory">Category</label>
                        <select id="expCategory" name="category" required>
                            <option value="">Select category...</option>
                            <option value="Decorations">Decorations</option>
                            <option value="Food & Beverages">Food & Beverages</option>
                            <option value="Gifts">Gifts</option>
                            <option value="Logistics">Logistics</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expAmount">Amount (₹)</label>
                        <input type="number" id="expAmount" name="amount" min="1" step="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="expPaidBy">Paid By (Name)</label>
                        <input type="text" id="expPaidBy" name="paid_by" required placeholder="Who paid for this?">
                    </div>

                    <div class="form-group">
                        <label for="expDescription">Description</label>
                        <input type="text" id="expDescription" name="description" required placeholder="Brief description of expense">
                    </div>

                    <div class="form-group">
                        <label for="expReceipt">Receipt / Evidence</label>
                        <input type="file" id="expReceipt" name="receipt" accept=".jpg,.jpeg,.png,.pdf" required>
                        <small style="display:block;margin-top:0.25rem;color:#71717a">Max 5MB. JPG, PNG, or PDF.</small>
                    </div>

                    <button type="submit" id="expSubmitBtn" class="btn-primary">SUBMIT EXPENSE</button>
                    <div id="expFormFeedback" class="feedback-msg"></div>
                </form>
            </section>

            <section id="viewActivity" class="view">
                <div class="activity-header">
                    <h2>Recent Contributions</h2>
                    <button id="refreshActivityBtn" class="btn-icon">↻</button>
                </div>
                <div id="activityList" class="activity-list">
                    <!-- Loaded dynamically -->
                    <div class="loading">Loading activity...</div>
                </div>
            </section>

        </main>
    </div>
    <script src="/js/collector.js"></script>
</body>
</html>
